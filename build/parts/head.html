<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<script>document.documentElement.classList.add('js')</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="keywords" content="{{KEYWORDS}}">
<meta name="author" content="ROI Loan Experts">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<meta name="theme-color" content="#D6202E">
<meta name="format-detection" content="telephone=no">
<link rel="canonical" href="{{CANON}}">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/favicon.svg">
<link rel="manifest" href="site.webmanifest">

<meta property="og:type" content="website">
<meta property="og:site_name" content="ROI Loan Experts">
<meta property="og:locale" content="en_IN">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANON}}">
<meta property="og:image" content="assets/img/og-cover.svg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESC}}">
<meta name="twitter:image" content="assets/img/og-cover.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/pages.css">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": ["FinancialService", "LocalBusiness"],
      "@id": "{{CANON}}#organisation",
      "name": "ROI Loan Experts",
      "alternateName": "ROI Loan Experts DSA",
      "description": "ROI Loan Experts is a loan assistance and DSA services company that helps customers review documents, understand financial profiles and explore suitable loan options across multiple banking and financial partners in India.",
      "slogan": "The Right Loan. The Right Bank. The Right Guidance.",
      "url": "{{CANON}}",
      "email": "",
      "telephone": "",
      "areaServed": { "@type": "Country", "name": "India" },
      "founder": { "@type": "Person", "name": "Abdul Haq Khan", "jobTitle": "Founder" },
      "employee": [
        { "@type": "Person", "name": "Abdul Haq Khan", "jobTitle": "Founder" },
        { "@type": "Person", "name": "Shahnawaz Khan", "jobTitle": "Chief Executive Officer" }
      ],
      "knowsAbout": [
        "Personal loan assistance", "Business loan assistance", "Home loan assistance",
        "Vehicle loan", "Education loan", "Loan against property", "Gold loan",
        "Loan eligibility check", "DSA services"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Loan assistance services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Personal Loan Assistance" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Business Loan Assistance" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Home Loan Assistance" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Vehicle Loan" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Education Loan" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Loan Against Property" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Gold Loan" } }
        ]
      }
    },
    {
      "@type": "WebSite",
      "@id": "{{CANON}}#website",
      "url": "{{CANON}}",
      "name": "ROI Loan Experts",
      "inLanguage": "en-IN",
      "publisher": { "@id": "{{CANON}}#organisation" }
    }
  ]
}
</script>
</head>
